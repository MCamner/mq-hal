name: Release gate parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jsonschema for tests/stack-contract-smoke.sh (mq-agent's provenance
      # schema uses oneOf/if/$ref, beyond a stdlib check), installed into the
      # runner's own Python so the release gate keeps running under the same
      # interpreter as before. It is externally managed, hence the flag; the
      # runner is discarded after the job.
      - name: Install test dependencies
        run: python3 -m pip install --break-system-packages jsonschema

      - name: Validate gate parity
        run: python3 scripts/check-gate-parity.py

      - name: Test parity failures
        run: python3 scripts/check-gate-parity.py --self-test

      - name: Run release gate
        run: |
          ./release-check.sh --json | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["schema"]=="repo_release_check.v1" and p["status"]=="READY", p'
