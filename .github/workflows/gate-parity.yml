name: Release gate parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release gate below runs tests/stack-contract-smoke.sh, which needs
      # jsonschema. setup-python gives a pip-installable interpreter; the
      # runner's Homebrew Python is not.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install jsonschema

      - name: Validate gate parity
        run: python3 scripts/check-gate-parity.py

      - name: Test parity failures
        run: python3 scripts/check-gate-parity.py --self-test

      - name: Run release gate
        run: |
          ./release-check.sh --json | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["schema"]=="repo_release_check.v1" and p["status"]=="READY", p'
