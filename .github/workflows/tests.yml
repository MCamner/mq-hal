name: Tests

on:
  # Scoped to main: a bare `push:` also fires on feature branches, so a branch
  # with an open PR reports the same check name twice on one SHA, and required
  # status checks match on the name while ignoring the event. Pushes to main
  # stay post-merge verification, as in gate-parity.yml.
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jsonschema for tests/stack-contract-smoke.sh: mq-agent's provenance
      # schema uses oneOf/if/$ref, beyond a stdlib check. setup-python gives a
      # pip-installable interpreter; the runner's Homebrew Python is not.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install jsonschema

      - name: Show Python version
        run: python3 --version

      # mq.doctor-status.v1 is owned by macos-scripts; mq-hal keeps a copy in
      # schemas/vendor/. With this checkout the contract smoke test compares
      # the copy against the owner's file instead of skipping.
      #
      # Only that one file: the checkout lands inside this workspace, and a
      # full tree there fills repo_memory's MAX_INDEX_FILES cap before mq-hal's
      # own files are reached, which failed repo-memory-smoke.sh.
      - name: Check out canonical macos-scripts contracts
        uses: actions/checkout@v4
        with:
          repository: MCamner/macos-scripts
          ref: main
          path: .canonical/macos-scripts
          sparse-checkout: schemas/mq.doctor-status.v1.json
          sparse-checkout-cone-mode: false

      # mq-agent owns the stack cockpit/release-check/provenance schemas (and
      # runtime_identity, which provenance $refs); mq-hal vendors them. Only
      # those four files, for the same repo_memory reason as above.
      - name: Check out canonical mq-agent contracts
        uses: actions/checkout@v4
        with:
          repository: MCamner/mq-agent
          ref: main
          path: .canonical/mq-agent
          sparse-checkout: |
            schemas/mq_stack_cockpit.schema.json
            schemas/mq_stack_release_check.schema.json
            schemas/stack_provenance.schema.json
            schemas/runtime_identity.schema.json
          sparse-checkout-cone-mode: false

      - name: Release check (dry-run)
        env:
          MQ_CANONICAL_MACOS_SCRIPTS_ROOT: ${{ github.workspace }}/.canonical/macos-scripts
          MQ_CANONICAL_AGENT_ROOT: ${{ github.workspace }}/.canonical/mq-agent
        # Single source of truth for CI: syntax check, version sync, all smoke
        # tests, and command-surface consistency. --dry-run skips only the
        # "is this version already released" gate so post-release pushes stay
        # green. Keep this in step with release-check.sh instead of maintaining
        # a parallel list here.
        run: ./release-check.sh --dry-run

      - name: Check skills consistency
        run: |
          ./scripts/check-skills.sh
