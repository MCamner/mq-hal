name: Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Run smoke test
        run: ./tests/smoke.sh

      - name: Python syntax check
        run: python3 -m py_compile scripts/hal.py
